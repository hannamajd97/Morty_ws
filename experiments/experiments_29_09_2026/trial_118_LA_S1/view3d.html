back.addScaledVector(UP, -back.dot(UP)).normalize();

camera.position.copy(c).addScaledVector(back, 2.5*r).addScaledVector(UP, 1.2*r);

controls.object.up.copy(UP);   // OrbitControls orbits about ITS object's up
