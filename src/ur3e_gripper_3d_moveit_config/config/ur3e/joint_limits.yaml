# Copied from `ur_description/config/ur3e/joint_limits.yaml` and overridden to make wrist_3_joint bounded.
#
# This file exists because `ur_robot_driver/launch/ur_control.launch.py` builds these paths from
# `description_package`:
#   - config/<ur_type>/joint_limits.yaml
#   - config/<ur_type>/physical_parameters.yaml
#   - config/<ur_type>/visual_parameters.yaml
#
# Without these files, launching the UR driver with `description_package:=ur3e_gripper_3d_moveit_config`
# fails during xacro processing.
joint_limits:
  shoulder_pan_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  shoulder_lift_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  elbow_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  wrist_1_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  wrist_2_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  wrist_3_joint:
    # Overridden from upstream (continuous) to bounded revolute.
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
