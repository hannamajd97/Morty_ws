planning_plugin: ompl_interface/OMPLPlanner
request_adapters: >-
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.1

planner_configs:
  RRTConnectkConfigDefault:
    type: geometric::RRTConnect
    range: 0.0

  RRTkConfigDefault:
    type: geometric::RRT
    range: 0.0
    goal_bias: 0.05

  RRTstarkConfigDefault:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
    delay_collision_checking: 1

  PRMkConfigDefault:
    type: geometric::PRM
    max_nearest_neighbors: 10

  PRMstarkConfigDefault:
    type: geometric::PRMstar

  ESTkConfigDefault:
    type: geometric::EST
    range: 0.0
    goal_bias: 0.05

  SBLkConfigDefault:
    type: geometric::SBL
    range: 0.0

  KPIECEkConfigDefault:
    type: geometric::KPIECE
    range: 0.0
    goal_bias: 0.05
    border_fraction: 0.9

  BKPIECEkConfigDefault:
    type: geometric::BKPIECE
    range: 0.0
    border_fraction: 0.9

  LBKPIECEkConfigDefault:
    type: geometric::LBKPIECE
    range: 0.0
    border_fraction: 0.9

  TRRTkConfigDefault:
    type: geometric::TRRT
    range: 0.0
    goal_bias: 0.05
    max_states_failed: 10
    temp_change_factor: 2.0
    min_temperature: 0.001
    init_temperature: 0.0001
    frountier_threshold: 0.0
    frountierNodeRatio: 0.1
    k_constant: 0.0

ur3e_manipulator:
  planner_configs:
    - RRTConnectkConfigDefault
    - RRTkConfigDefault
    - RRTstarkConfigDefault
    - PRMkConfigDefault
    - PRMstarkConfigDefault
    - ESTkConfigDefault
    - SBLkConfigDefault
    - KPIECEkConfigDefault
    - BKPIECEkConfigDefault
    - LBKPIECEkConfigDefault
    - TRRTkConfigDefault
  # 0.1 is very coarse for a UR arm + gripper and can allow OMPL to accept edges that
  # later interpolate into self-collision (e.g. forearm_link vs gripper_base), causing
  # "Computed path is not valid" and plan rejection.
  longest_valid_segment_fraction: 0.01
