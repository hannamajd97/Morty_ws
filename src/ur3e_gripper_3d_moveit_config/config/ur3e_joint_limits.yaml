# Copied from `ur_description/config/ur3e/joint_limits.yaml` and overridden to make wrist_3_joint bounded.
#
# Motivation:
# - Upstream UR description models wrist_3_joint as continuous (no position limits).
# - RViz MotionPlanning's "Joints" tab can make continuous joints hard/impossible to edit in some setups.
# - Bounding wrist_3_joint restores an editable widget/slider for goal state tuning.
joint_limits:
  shoulder_pan_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  shoulder_lift_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  elbow_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  wrist_1_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  wrist_2_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
  wrist_3_joint:
    # Overridden from upstream (continuous) to bounded revolute.
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 9.0
    max_position: !degrees  360.0
    max_velocity: !degrees  360.0
    min_position: !degrees -360.0
