# ros2_control controller configuration (for use with `use_fake_hardware:=true`)
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ur3e_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_hw_controller:
      type: position_controllers/GripperActionController

joint_state_broadcaster:
  ros__parameters:
    # Publish on /joint_state_broadcaster/joint_states and let `joint_state_publisher`
    # merge/publish a single /joint_states stream (avoids multiple publishers on /joint_states).
    use_local_topics: true
    # Don't publish effort, as mock components may output NaNs which can confuse consumers (e.g. MoveIt state monitor).
    interfaces:
      - position
      - velocity
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      - gripper_close_open_joint

ur3e_arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

gripper_hw_controller:
  ros__parameters:
    joint: gripper_close_open_joint
